<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Account Privacy（已取消）</title><style>body{max-width:1050px;margin:32px auto;padding:0 20px;font:16px/1.7 system-ui;color:#172033}h1,h2,h3{line-height:1.3}table{border-collapse:collapse;display:block;overflow:auto}th,td{border:1px solid #d9e0ea;padding:8px;text-align:left;vertical-align:top}pre{background:#f6f8fb;padding:16px;overflow:auto}code{font-size:.9em}a{color:#155eef}@media(max-width:600px){body{margin:16px auto;padding:0 12px}}</style></head><body><p><a href="../design/modules/account-privacy.md">权威 Markdown 契约</a></p><h1 id="account-privacy已取消">Account Privacy（已取消）</h1>
<blockquote>
<p>Retired — 2026-09-17；Issue #31 / ADR 0017。</p>
</blockquote>
<p>独立模块、PRIVACY-001/002、participant、AccountScope 状态机、逐 Owner 清理、证明及持久化屏障已取消。
生产代码、fake 和协议专用测试移除；没有替代安全协调模块。业务页面按普通 Flutter 生命周期结束。
退出执行 SDK 当前设备 signOut，成功回登录，失败普通重试；不删除云端记录、公共缓存或预算 JSON。
参见 <a href="../design/system/architecture.md">当前架构</a> 与 <a href="../adr/0017-minimal-account-and-online-user-records.md">ADR 0017</a>。</p></body></html>
